name: Rain alert wake and sweep

# Two staggered schedules:
# 1) /health every 5 minutes to wake/keep Render warm.
# 2) /tasks/sweep_alerts every 10 minutes, offset by +2 minutes, so the sweep
#    is less likely to be the cold-start request that times out at the cron
#    provider.
#
# If you set a SWEEP_TOKEN env var on the backend, add a matching repo secret
# named SWEEP_TOKEN (Settings -> Secrets -> Actions) and it is sent automatically.

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

jobs:
  keep-warm:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend
        run: |
          curl -s -m 120 -w "health: %{http_code}\n" \
            "https://garaj-baras-api.onrender.com/health" || true

  sweep:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '2,12,22,32,42,52 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert sweep
        run: |
          curl -s -m 120 -w "sweep: %{http_code}\n" \
            "https://garaj-baras-api.onrender.com/tasks/sweep_alerts?token=${{ secrets.SWEEP_TOKEN }}" || true
