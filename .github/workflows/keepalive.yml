name: Rain alert sweep

# Fires the scheduled alert sweep every 10 minutes: the backend refreshes each
# radar that has saved subscriptions and pushes any due rain notifications. This
# also keeps Render's free tier awake (it sleeps after ~15 idle minutes), so it
# replaces the old bare /health ping — alerts no longer depend on a user
# happening to browse that radar's city.
#
# If you set a SWEEP_TOKEN env var on the backend, add a matching repo secret
# named SWEEP_TOKEN (Settings → Secrets → Actions) and it is sent automatically.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert sweep
        run: |
          curl -s -m 120 -w "sweep: %{http_code}\n" \
            "https://garaj-baras-api.onrender.com/tasks/sweep_alerts?token=${{ secrets.SWEEP_TOKEN }}" || true
