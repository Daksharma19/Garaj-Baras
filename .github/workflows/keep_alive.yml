name: Keep Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 30 https://garaj-baras-api.onrender.com/health \
            && echo "Server is alive" \
            || echo "Ping failed (server may be waking up)"
