<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#863bff" />
  <title>Offline — Garaj Baras</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1a1030; color: #ede6ff; font-family: system-ui, sans-serif; text-align: center;
    }
    .card { padding: 32px 24px; max-width: 340px; }
    img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 18px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { color: #b8a8e8; line-height: 1.5; margin: 0 0 22px; }
    button {
      background: #863bff; color: #fff; border: 0; border-radius: 12px;
      padding: 12px 28px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="Garaj Baras" />
    <h1>You're offline</h1>
    <p>Garaj Baras needs an internet connection to fetch live radar data. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
